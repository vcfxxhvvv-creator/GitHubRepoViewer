name: Build & Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Build Release APK (unsigned)
      run: ./gradlew assembleRelease

    - name: Upload Debug APK to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: GitHubRepoViewer-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Upload Release APK to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: GitHubRepoViewer-release-unsigned
        path: app/build/outputs/apk/release/app-release-unsigned.apk

    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v1.0.${{ github.run_number }}
        release_name: GitHub Repo Viewer v1.0.${{ github.run_number }}
        body: |
          ## GitHub Repo Viewer - إصدار جديد 🚀

          ### الملفات المتوفرة:
          - `app-debug.apk` — APK debug (قابل للتثبيت مباشرة)
          - `app-release-unsigned.apk` — APK release بدون توقيع

          ### ملاحظة:
          للتوقيع الرقمي ونشره على Google Play، يجب توقيعه بـ Keystore خاص.
        draft: false
        prerelease: false

    - name: Upload Debug APK to Release
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: app/build/outputs/apk/debug/app-debug.apk
        asset_name: GitHubRepoViewer-v1.0.${{ github.run_number }}-debug.apk
        asset_content_type: application/vnd.android.package-archive

    - name: Upload Release APK to Release
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: app/build/outputs/apk/release/app-release-unsigned.apk
        asset_name: GitHubRepoViewer-v1.0.${{ github.run_number }}-release-unsigned.apk
        asset_content_type: application/vnd.android.package-archive
