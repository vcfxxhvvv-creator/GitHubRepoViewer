name: Build APK

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install Android SDK
      run: |
        sudo apt-get update
        sudo apt-get install -y wget unzip
        mkdir -p $HOME/android-sdk/cmdline-tools
        cd $HOME/android-sdk/cmdline-tools
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip -q commandlinetools-linux-11076708_latest.zip
        mv cmdline-tools latest
        export ANDROID_HOME=$HOME/android-sdk
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
        yes | sdkmanager --licenses || true
        sdkmanager "platforms;android-34" "build-tools;34.0.0"
        echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
        echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH

    - name: Install Gradle
      run: |
        wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
        unzip -q gradle-8.2-bin.zip
        sudo mv gradle-8.2 /opt/gradle
        sudo ln -sf /opt/gradle/bin/gradle /usr/local/bin/gradle
        gradle --version

    - name: Generate Gradle Wrapper
      run: |
        gradle wrapper --gradle-version 8.2
        chmod +x gradlew

    - name: Build Debug APK
      run: |
        export ANDROID_HOME=$HOME/android-sdk
        ./gradlew assembleDebug --stacktrace
        ls -la app/build/outputs/apk/debug/

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GitHubRepoViewer-APK
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: GitHub Repo Viewer v1.0.${{ github.run_number }}
        files: app/build/outputs/apk/debug/app-debug.apk
        body: |
          ## 🚀 GitHub Repo Viewer - APK جاهز!

          **✅ تم البناء بنجاح**

          📥 **رابط التحميل:**
          ⬇️ [app-debug.apk](https://github.com/vcfxxhvvv-creator/GitHubRepoViewer/releases/download/v1.0.${{ github.run_number }}/app-debug.apk)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Print Download Link
      run: |
        echo "=========================================="
        echo "✅ APK تم البناء بنجاح!"
        echo "=========================================="
        echo "📥 رابط التحميل:"
        echo "https://github.com/vcfxxhvvv-creator/GitHubRepoViewer/releases/download/v1.0.${{ github.run_number }}/app-debug.apk"
        echo "=========================================="
