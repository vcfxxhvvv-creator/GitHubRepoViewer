name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: mingc/android-build-box:latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Generate Gradle Wrapper
      run: |
        gradle wrapper --gradle-version 8.2
        chmod +x gradlew
        ls -la gradlew

    - name: Build Debug APK
      run: |
        ./gradlew assembleDebug --stacktrace
        ls -la app/build/outputs/apk/debug/

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GitHubRepoViewer-APK
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Create Release with APK
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: GitHub Repo Viewer v1.0.${{ github.run_number }}
        files: app/build/outputs/apk/debug/app-debug.apk
        body: |
          ## 🚀 GitHub Repo Viewer - APK جاهز!

          **✅ تم البناء والتسليم بنجاح**

          📥 **رابط التحميل المباشر:**
          ⬇️ [app-debug.apk](https://github.com/vcfxxhvvv-creator/GitHubRepoViewer/releases/download/v1.0.${{ github.run_number }}/app-debug.apk)

          ### طريقة التثبيت:
          1. حمل ملف APK من الرابط أعلاه
          2. فعّل "تثبيت من مصادر غير معروفة" في إعدادات الأمان
          3. ثبّت التطبيق واستمتع!
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Print Download Link
      run: |
        echo ""
        echo "=========================================="
        echo "✅✅✅ APK تم البناء بنجاح! ✅✅✅"
        echo "=========================================="
        echo ""
        echo "📥 رابط التحميل المباشر:"
        echo "https://github.com/vcfxxhvvv-creator/GitHubRepoViewer/releases/download/v1.0.${{ github.run_number }}/app-debug.apk"
        echo ""
        echo "📦 صفحة الـ Release:"
        echo "https://github.com/vcfxxhvvv-creator/GitHubRepoViewer/releases/tag/v1.0.${{ github.run_number }}"
        echo "=========================================="
