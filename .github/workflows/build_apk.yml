name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install Android SDK
      run: |
        # Unset any existing ANDROID_HOME to avoid conflicts
        unset ANDROID_HOME
        unset ANDROID_SDK_ROOT

        sudo apt-get update
        sudo apt-get install -y wget unzip

        # Install Android SDK to a fixed location
        export ANDROID_HOME=/usr/local/android-sdk
        sudo mkdir -p $ANDROID_HOME/cmdline-tools
        cd $ANDROID_HOME/cmdline-tools
        sudo wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        sudo unzip -q commandlinetools-linux-11076708_latest.zip
        sudo mv cmdline-tools latest

        # Accept licenses and install platforms
        yes | sudo $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        sudo $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"

        # Set environment variables for subsequent steps
        echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
        echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

    - name: Install Gradle
      run: |
        wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
        unzip -q gradle-8.2-bin.zip
        sudo mv gradle-8.2 /opt/gradle
        sudo ln -sf /opt/gradle/bin/gradle /usr/local/bin/gradle
        gradle --version

    - name: Generate Gradle Wrapper & Set SDK
      run: |
        gradle wrapper --gradle-version 8.2
        chmod +x gradlew
        # Create local.properties with correct SDK path
        echo "sdk.dir=/usr/local/android-sdk" > local.properties
        echo "sdk.dir=/usr/local/android-sdk" > app/local.properties
        cat local.properties

    - name: Build Debug APK
      run: |
        export ANDROID_HOME=/usr/local/android-sdk
        export ANDROID_SDK_ROOT=/usr/local/android-sdk
        # Give the runner its own writable keystore dir (fixes "debug keystore ... not writable")
        export ANDROID_USER_HOME="$HOME/.android"
        mkdir -p "$ANDROID_USER_HOME"
        ./gradlew assembleDebug --stacktrace
        ls -la app/build/outputs/apk/debug/

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: NovaDrift-APK
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: Nova Drift v1.0.${{ github.run_number }}
        files: app/build/outputs/apk/debug/app-debug.apk
        body: |
          ## 🚀 Nova Drift - Space Runner

          **✅ Build succeeded — APK ready**

          📥 Download **app-debug.apk** from the workflow artifacts or this release.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Print Summary
      run: |
        echo "=========================================="
        echo "✅ APK built successfully!"
        echo "📦 Artifact: NovaDrift-APK"
        echo "=========================================="
