name: Build APK

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    container: reactnativecommunity/react-native-android
    steps:
    - uses: actions/checkout@v4

    - name: Build Debug APK
      run: |
        gradle wrapper --gradle-version 8.2
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace
        ls -la app/build/outputs/apk/debug/

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GitHubRepoViewer-APK
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: GitHub Repo Viewer v1.0.${{ github.run_number }}
        files: app/build/outputs/apk/debug/app-debug.apk
        body: |
          ## 🚀 GitHub Repo Viewer - APK جاهز!

          **✅ تم البناء بنجاح**

          📥 **رابط التحميل:**
          ⬇️ [app-debug.apk](https://github.com/vcfxxhvvv-creator/GitHubRepoViewer/releases/download/v1.0.${{ github.run_number }}/app-debug.apk)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Print Download Link
      run: |
        echo "=========================================="
        echo "✅ APK تم البناء بنجاح!"
        echo "=========================================="
        echo "📥 رابط التحميل:"
        echo "https://github.com/vcfxxhvvv-creator/GitHubRepoViewer/releases/download/v1.0.${{ github.run_number }}/app-debug.apk"
        echo "=========================================="
